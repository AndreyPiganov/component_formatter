x-database-environment: &database-environment
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-component_formatter_local}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: component_formatter
      POSTGRES_USER: component_formatter
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-component_formatter_local}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "component_formatter", "-d", "component_formatter"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: ./backend
      target: migrate
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      target: production
    environment:
      <<: *database-environment
      ASSETS_DIR: /assets
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./assets
        target: /assets
        read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(Number(!r.ok))).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
